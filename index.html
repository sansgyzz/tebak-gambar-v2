<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Penjualan Menarik</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .produk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .produk {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .produk:hover {
            transform: scale(1.02);
        }
        .produk img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .produk-details {
            padding: 15px;
        }
        .produk h3 {
            margin-top: 0;
        }
        .harga {
            color: #e91e63;
            font-weight: bold;
            margin-top: 10px;
        }
        .beli-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .beli-btn:hover {
            background-color: #45a049;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
        }
        .sosmed {
            margin-top: 10px;
        }
        .sosmed a {
            margin: 0 10px;
            color: #fff;
            font-size: 24px;
            text-decoration: none;
            transition: color 0.3s;
        }
        .sosmed a:hover {
            color: #ffeb3b;
        }
    </style>
</head>
<body>

<header>
    <h1>Toko Penjualan Online</h1>
</header>

<div class="container">
    <h2>Produk Unggulan</h2>
    <div class="produk-grid">
        <div class="produk">
            <img src="https://via.placeholder.com/400x200.png?text=Produk+1" alt="Produk 1" />
            <div class="produk-details">
                <h3>Produk A</h3>
                <p>Deskripsi singkat produk A.</p>
                <div class="harga">Rp 100.000</div>
                <a href="#" class="beli-btn">Beli Sekarang</a>
            </div>
        </div>
        <div class="produk">
            <img src="https://via.placeholder.com/400x200.png?text=Produk+2" alt="Produk 2" />
            <div class="produk-details">
                <h3>Produk B</h3>
                <p>Deskripsi singkat produk B.</p>
                <div class="harga">Rp 150.000</div>
                <a href="#" class="beli-btn">Beli Sekarang</a>
            </div>
        </div>
        <div class="produk">
            <img src="https://via.placeholder.com/400x200.png?text=Produk+3" alt="Produk 3" />
            <div class="produk-details">
                <h3>Produk C</h3>
                <p>Deskripsi singkat produk C.</p>
                <div class="harga">Rp 200.000</div>
                <a href="#" class="beli-btn">Beli Sekarang</a>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>Hubungi Kami & Sosial Media</p>
    <div class="sosmed">
        <a href="https://facebook.com" target="_blank" title="Facebook">🌐</a>
        <a href="https://instagram.com" target="_blank" title="Instagram">📸</a>
        <a href="https://twitter.com" target="_blank" title="Twitter">🐦</a>
    </div>
</footer>

</body>
</html>
