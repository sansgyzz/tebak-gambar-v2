<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Gambar Multiplayer Online</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* LOBBY SCREEN */
        .lobby-screen {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        .lobby-title {
            font-size: 4em;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px #fff; }
            to { text-shadow: 0 0 30px #4ecdc4, 0 0 40px #4ecdc4; }
        }

        .nickname-input {
            padding: 20px;
            font-size: 1.5em;
            border: none;
            border-radius: 50px;
            width: 400px;
            max-width: 90%;
            margin: 30px 0;
            text-align: center;
            font-weight: 600;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .join-btn {
            padding: 20px 50px;
            font-size: 1.5em;
            background: linear-gradient(45deg, #4ecdc4, #44bdad);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 15px 35px rgba(78, 205, 196, 0.4);
            transition: all 0.3s ease;
        }

        .join-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 45px rgba(78, 205, 196, 0.6);
        }

        /* GAME SCREEN */
        .game-screen {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            margin: 20px 0;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .room-info {
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 154, 158, 0.3);
        }

        .player-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .main-game {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .main-game {
                grid-template-columns: 1fr;
            }
        }

        .game-left {
            text-align: center;
        }

        .image-container {
            width: 100%;
            max-width: 500px;
            height: 400px;
            margin: 0 auto 30px;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            cursor: pointer;
        }

        .game-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-image.blurred {
            filter: blur(10px) brightness(0.6);
        }

        .hint {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 193, 7, 0.95);
            color: white;
            padding: 15px 20px;
            border-radius: 25px;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(255, 193, 7, 0.4);
        }

        .input-section {
            margin-bottom: 30px;
        }

        .game-input {
            width: 100%;
            padding: 25px;
            font-size: 1.4em;
            border: 4px solid #e1e8ed;
            border-radius: 50px;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-input:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.4);
        }

        .game-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 18px 35px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
        }

        .btn-primary { background: linear-gradient(45deg, #4ecdc4, #44bdad); color: white; }
        .btn-secondary { background: linear-gradient(45deg, #ff6b6b, #ff5252); color: white; }
        .btn-hint { background: linear-gradient(45deg, #ffa726, #ff9800); color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        /* PLAYERS LIST */
        .players-section {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            border-radius: 25px;
            padding: 30px;
            height: fit-content;
        }

        .players-title {
            font-size: 1.5em;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 20px;
            text-align: center;
        }

        .players-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .player-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.7);
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .player-item.leader {
            border-left: 5px solid #ffd700;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 1.2em;
            margin-right: 15px;
        }

        .player-info h4 {
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 5px;
        }

        .player-score {
            color: #00b894;
            font-weight: 700;
            font-size: 1.1em;
        }

        /* CHAT */
        .chat-section {
            margin-top: 30px;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            padding: 25px;
        }

        .chat-messages {
            height: 250px;
            overflow-y: auto;
            border: 2px solid #e1e8ed;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            background: white;
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 25px;
            font-family: 'Poppins', sans-serif;
        }

        .send-btn {
            padding: 15px 25px;
            background: #4ecdc4;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        .message-item {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 12px;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-own {
            background: linear-gradient(45deg, #4ecdc4, #44bdad);
            color: white;
            margin-left: 20%;
            text-align: right;
        }

        .message-other {
            background: #f1f2f6;
            color: #2d3436;
        }

        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }

        .victory-content {
            background: white;
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            animation: bounceIn 0.8s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- LOBBY SCREEN -->
    <div class="lobby-screen" id="lobbyScreen">
        <h1 class="lobby-title">🎮 Tebak Gambar Online</h1>
        <p style="font-size: 1.5em; margin-bottom: 40px;">Main bareng temen, target 120 poin!</p>
        <input type="text" class="nickname-input" id="nicknameInput" placeholder="Masukkan nickname kamu..." maxlength="15">
        <br>
        <button class="join-btn" onclick="joinRoom()">🚀 Gabung Room</button>
        <p style="margin-top: 30px; opacity: 0.8;">Room ID: <strong>TEBAK-GAMBAR-2024</strong></p>
    </div>

    <!-- GAME SCREEN -->
    <div class="container">
        <div class="game-screen" id="gameScreen">
            <div class="header">
                <div class="room-info">
                    <h3>🆔 Room: TEBAG-GAMBAR-2024</h3>
                    <div class="player-stats">
                        <div class="stat-item">
                            👥 Pemain: <span id="playerCount">0</span>
                        </div>
                        <div class="stat-item">
                            ⏱️ Waktu: <span id="timer">60</span>s
                        </div>
                    </div>
                </div>
                <div class="stat-item">
                    🏆 Score Kamu: <span id="myScore">0</span>
                </div>
            </div>

            <div class="main-game">
                <div class="game-left">
                    <div class="image-container" id="imageContainer" onclick="toggleBlur()">
                        <img src="" alt="Tebak gambar!" class="game-image blurred" id="gameImage">
                        <div class="hint" id="hint">Loading...</div>
                    </div>
                    
                    <div class="input-section">
                        <input type="text" class="game-input" id="answerInput" placeholder="Ketik jawabanmu SEKARANG!" maxlength="20">
                    </div>
                    
                    <div class="game-buttons">
                        <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">✅ Jawab</button>
                        <button class="btn btn-hint" id="hintBtn" onclick="requestHint()">💡 Petunjuk</button>
                    </div>
                    
                    <div id="gameMessage" style="margin-top: 20px; font-size: 1.3em; font-weight: 600; min-height: 30px;"></div>
                </div>

                <div class="players-section">
                    <h3 class="players-title">👥 Pemain Online</h3>
                    <div class="players-list" id="playersList"></div>
                </div>
            </div>

            <div class="chat-section">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-container">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Chat dengan pemain lain..." maxlength="100">
                    <button class="send-btn" onclick="sendChat()">📤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- VICTORY OVERLAY -->
    <div class="victory-overlay" id="victoryOverlay">
        <div class="victory-content">
            <h1 style="font-size: 3em; color: #ffd700; margin-bottom: 20px;">🏆 JUARA!</h1>
            <p style="font-size: 1.5em; margin-bottom: 30px;">Kamu mencapai 120 poin pertama!</p>
            <button class="join-btn" onclick="location.reload()" style="font-size: 1.2em;">🎮 Main Lagi</button>
        </div>
    </div>

    <script>
        // Firebase Config (Ganti dengan config kamu atau gunakan ini untuk demo)
        const firebaseConfig = {
            apiKey: "AIzaSyDq8q8vF8q8q8q8q8q8q8q8q8q8q8q8q8q",
            authDomain: "tebak-gambar-multiplayer.firebaseapp.com",
            projectId: "tebak-gambar-multiplayer",
            storageBucket: "tebak-gambar-multiplayer.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Game State
        let myNickname = '';
        let myPlayerId = '';
        let roomId = 'TEBAK-GAMBAR-2024';
        let currentImageIndex = 0;
        let gameTimer = 60;
        let myScore = 0;
        let hasAnswered = false;
        let imageData = [];

        // Initialize Images
        const images = [
            { src: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500', answer: 'kucing', hint: '🐱 Hewan peliharaan' },
            { src: 'https://images.unsplash.com/photo-1574158622682-e40e69881006?w=500', answer: 'anjing', hint: '🐶 Teman setia' },
            { src: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500', answer: 'mobil', hint: '🚗 Roda 4' },
            { src: 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=500', answer: 'rumah', hint: '🏠 Tempat tinggal' },
            { src: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500', answer: 'buku', hint: '📚 Belajar' },
            { src: 'https://images.unsplash.com/photo-1505751172876-fa1923c5c528?w=500', answer: 'pohon', hint: '🌳 Hijau' },
            { src: 'https://images.unsplash.com/photo-1546538490-0fe0a8eba4e6?w=500', answer: 'bunga', hint: '🌸 Cantik' },
            { src: 'https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=500', answer: 'pesawat', hint: '✈️ Terbang' },
            { src: 'https://images.unsplash.com/photo-1444464666168-49d633b86736?w=500', answer: 'sepeda', hint: '🚲 Olahraga' },
            { src: 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=500', answer: 'komputer', hint: '💻 Internet' }
        ];

        imageData = images;

        // Join Room
        function joinRoom() {
            myNickname = document.getElementById('nicknameInput').value.trim();
            if (!myNickname) {
                alert('Masukkan nickname dulu!');
                return;
            }

            myPlayerId = 'player_' + Date.now();
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('gameScreen').style.display = 'block';

            // Join room
            db.collection('rooms').doc(roomId).set({
                currentImage: 0,
                timer: 60,
                status: 'active',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            // Add player
            db.collection('rooms').doc(roomId).collection('players').doc(myPlayerId).set({
                nickname: myNickname,
                score: 0,
                answered: false,
                joinedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            initGame();
        }

        // Initialize Game
        function initGame() {
            loadImage();
            setupRealtimeListeners();
            document.getElementById('answerInput').focus();
            startTimer();
        }

        // Load Current Image
        function loadImage() {
            db.collection('rooms').doc(roomId).get().then(doc => {
                if (doc.exists) {
                    currentImageIndex = doc.data().currentImage || 0;
                    const img = imageData[currentImageIndex];
                    document.getElementById('gameImage').src = img.src;
                    document.getElementById('hint').textContent = img.hint;
                }
            });
        }

        // Realtime Listeners
        function setupRealtimeListeners() {
            // Players list
            db.collection('rooms').doc(roomId).collection('players')
                .orderBy('score', 'desc')
                .onSnapshot(snapshot => {
                    let html = '';
                    let count = 0;
                    snapshot.forEach(doc => {
                        count++;
                        const player = doc.data();
                        const isMe = doc.id === myPlayerId;
                        const isLeader = count === 1;
                        const avatar = player.nickname.charAt(0).toUpperCase();
                        
                        html += `
                            <div class="player-item ${isLeader ? 'leader' : ''}">
                                <div class="player-avatar">${avatar}</div>
                                <div class="player-info">
                                    <h4>${player.nickname}${isMe ? ' (Kamu)' : ''}</h4>
                                    <div class="player-score">${player.score} poin ${player.answered ? '✅' : ''}</div>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('playersList').innerHTML = html || '<div style="text-align:center;color:#999;">Menunggu pemain...</div>';
                    document.getElementById('playerCount').textContent = count;
                });

            // My score
            db.collection('rooms').doc(roomId).collection('players').doc(myPlayerId)
                .onSnapshot(doc => {
                    if (doc.exists) {
                        myScore = doc.data().score;
                        document.getElementById('myScore').textContent = myScore;
                        if (myScore >= 120) {
                            showVictory();
                        }
                    }
                });

            // Chat messages
            db.collection('rooms').doc(roomId).collection('chat')
                .orderBy('timestamp', 'asc')
                .limit(50)
                .onSnapshot(snapshot => {
                    let html = '';
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const isMe = msg.playerId === myPlayerId;
                        html += `
                            <div class="message-item ${isMe ? 'message-own' : 'message-other'}">
                                <strong>${msg.nickname}:</strong> ${msg.message}
                            </div>
                        `;
                    });
                    document.getElementById('chatMessages').innerHTML = html;
                    document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
                });

            // Game state
            db.collection('rooms').doc(roomId).onSnapshot(doc => {
                if (doc.exists) {
                    const gameState = doc.data();
                    document.getElementById('timer').textContent = gameState.timer || 60;
                    loadImage();
                }
            });
        }

        // Submit Answer
        function submitAnswer() {
            const answer = document.getElementById('answerInput').value.toLowerCase().trim();
            if (!answer || hasAnswered) return;

            const correctAnswer = imageData[currentImageIndex].answer;
            
            if (answer === correctAnswer) {
                // Update my score
                db.collection('rooms').doc(roomId).collection('players').doc(myPlayerId).update({
                    score: firebase.firestore.FieldValue.increment(25),
                    answered: true
                });

                showMessage('🎉 BENAR! +25 poin', 'correct');
                hasAnswered = true;
                document.getElementById('submitBtn').disabled = true;
            } else {
                showMessage('❌ Salah! Coba lagi.', 'wrong');
            }
        }

        // Request Hint
        function requestHint() {
            const hint = imageData[currentImageIndex].hint;
            showMessage(hint, 'info');
        }

        // Toggle Blur (peek)
        function toggleBlur() {
            const img = document.getElementById('gameImage');
            img.classList.toggle('blurred');
            setTimeout(() => {
                img.classList.add('blurred');
            }, 1000);
        }

        // Send Chat
        function sendChat() {
            const message = document.getElementById('chatInput').value.trim();
            if (!message) return;

            db.collection('rooms').doc(roomId).collection('chat').add({
                playerId: myPlayerId,
                nickname: myNickname,
                message: message,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('chatInput').value = '';
        }

        // Show Message
        function showMessage(text, type = '') {
            const msgEl = document.getElementById('gameMessage');
            msgEl.textContent = text;
            msgEl.className = type;
            setTimeout(() => {
                msgEl.textContent = '';
            }, 3000);
        }

        // Timer
        function startTimer() {
            setInterval(() => {
                gameTimer--;
                if (gameTimer <= 0) {
                    gameTimer = 60;
                    // Next image
                    currentImageIndex = (currentImageIndex + 1) % imageData.length;
                    db.collection('rooms').doc(roomId).update({
                        currentImage: currentImageIndex,
                        timer: 60
                    });
                    hasAnswered = false;
                    document.getElementById('submitBtn').disabled = false;
                }
            }, 1000);
        }

        // Victory
        function showVictory() {
            document.getElementById('victoryOverlay').style.display = 'flex';
        }

        // Event Listeners
        document.getElementById('answerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitAnswer();
        });

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        // Auto-join on Enter
        document.getElementById('nicknameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinRoom();
        });
    </script>
</body>
</html>
